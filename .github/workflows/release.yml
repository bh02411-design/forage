name: Test and publish Forage release
on:
  push:
    branches: [main]
    paths: [version.json]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify version and select release tag
        run: |
          python - <<'PY'
          import json, os, re
          version = json.load(open('version.json'))['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          tag = 'v' + version
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('RELEASE_TAG=' + tag + '\n')
          PY
      - run: python -m unittest discover -s tests -p 'test*.py'
      - run: node --check static/app.js
      - run: node tests/test_cards.cjs
      - run: node tests/test_search.cjs
      - run: node tests/test_collection_sort.cjs
      - run: node tests/test_category_selection.cjs
      - run: node tests/test_swap_categories.cjs
      - run: node tests/test_render.cjs
      - run: python build_release.py --output dist/Forage-update.zip
      - name: Write readable release notes
        run: |
          python - <<'PY'
          from pathlib import Path
          import updater
          number = updater.current_version('.')
          notes = updater.CHANGELOG.get(number, ['Application maintenance update.'])
          Path('dist/release-notes.md').write_text('\n'.join('- ' + note for note in notes) + '\n', encoding='utf-8')
          PY
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/Forage-update.zip --target "$GITHUB_SHA" --notes-file dist/release-notes.md
