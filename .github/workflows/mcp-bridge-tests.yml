name: Forage MCP bridge tests
on:
  push:
    branches: [main, feature/mcp-remote-updater]
  pull_request:
    branches: [main]
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile private bridge and server
        run: python -m py_compile mcp_bridge.py server.py
      - name: Run bridge regression suite
        run: |
          python -m unittest discover -s tests -p 'test_mcp*.py' -v
          python -m unittest discover -s tests -p 'test_collection_change.py' -v
